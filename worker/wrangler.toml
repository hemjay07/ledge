name = "ledge-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# The minute indexer. One tick a minute; a tick that fails leaves the cursor
# where it was and the next tick simply covers a wider window.
[triggers]
crons = ["* * * * *"]

[vars]
FACTORY_ADDRESS = "0x7eD598BcEf8bd9Edd8C97A195C6d13f40801EC7e"
CHAIN_ID = "4663"
# Order swapped 2026-09-11, and the order is the whole point.
#
# The official endpoint rate-limits Cloudflare's egress hard -- DEPLOY.md has
# said so since the first deploy -- while answering fine from a laptop. With it
# first, every tick spent its whole subrequest budget retrying an endpoint that
# was never going to answer, and reached the fallback with nothing left. The
# indexer sat at "subrequest budget spent" at the head of the chain, doing no
# work at all, and the health endpoint reported a budget problem rather than the
# rate-limiting underneath it.
#
# So the endpoint that actually answers from this datacentre goes first. The
# official one stays as the fallback, where it costs one wasted call instead of
# four when it refuses. This is a deployment fact about where the Worker runs,
# not a judgement about which endpoint is better: the Python crawl runs from
# GitHub's runners and keeps the official endpoint first, because from there it
# works.
RPC_URL = "https://rpc.ordofi.network"
RPC_URL_FALLBACK = "https://rpc.mainnet.chain.robinhood.com"
# The live site. These were "https://ledge.tools" -- a domain that was never
# bought and does not resolve -- so the canonical config pointed at a dead
# host and only a `wrangler deploy --var` override kept the card and the
# per-token page working. A config that is wrong unless you remember a flag is
# a config that will be wrong. Point them at the host that actually serves the
# site, and change them once when a domain exists.
NUMBER_JSON_URL = "https://ledge.tools/number.json"
SITE_ORIGIN = "https://ledge.tools"

[[d1_databases]]
binding = "LEDGE_DB"
database_name = "ledge"
# Replaced with the real id by `wrangler d1 create ledge` before the first deploy.
database_id = "ef285d4f-4b56-4771-9d5b-c73ef1df7809"

[[kv_namespaces]]
binding = "LEDGE_KV"
# Replaced with the real id by `wrangler kv namespace create LEDGE_KV`.
id = "2907c9f2a1a94fb9a13fbb4eca8fdd3d"

# The two faces the death card is set in, inlined as bytes at build time.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[observability]
enabled = true

# Secrets, set once with `wrangler secret put` (never in this file):
#   TELEGRAM_BOT_TOKEN     bot token from @BotFather
#   TELEGRAM_WEBHOOK_SECRET  32-byte random, the {secret} path segment
#   TELEGRAM_HEADER_SECRET   32-byte random, X-Telegram-Bot-Api-Secret-Token
