name: crawl

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: ledge-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      hour: ${{ steps.commit.outputs.hour }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: crawl
        run: python pipeline/crawl.py
        env:
          RPC_URL: "${{ vars.RPC_URL }}"

      - name: recompute (byte-for-byte gate)
        run: python pipeline/recompute.py --check


      - name: commit data
        id: commit
        run: |
          git config user.name  "ledge-bot"
          git config user.email "ledge-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
            echo "hour=$(date -u +%H)" >> "$GITHUB_OUTPUT"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "hour=$(date -u +%H)" >> "$GITHUB_OUTPUT"
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1

  # The Worker's copy of the published figures. ARCHITECTURE-PHASE2-4.md §2:
  # the Action pushes number.json and the pair-token map into KV, so the live
  # layer is independent of Vercel — if the site is down the API still answers,
  # and if Cloudflare is down the static site still shows the Number. Neither
  # can take out the other.
  #
  # Without this the Worker falls back to fetching NUMBER_JSON_URL, which works
  # but couples the API's freshness to the site being up — the exact coupling
  # the KV design exists to remove.
  #
  # Downstream of the data commit, like the oracle: a failed push is a red run
  # and never blocks, dirties or delays the dataset.
  kv:
    needs: crawl
    if: needs.crawl.outputs.committed == 'true' && vars.LEDGE_KV_NAMESPACE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAMESPACE_ID: ${{ vars.LEDGE_KV_NAMESPACE_ID }}
    steps:
      # the branch tip, not the triggering SHA: the file to push is the one
      # the crawl job just committed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: push the measurement to KV
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -euo pipefail
          npx --yes wrangler@4 kv key put --namespace-id "$NAMESPACE_ID" \
            number:current --path data/number.json --remote
          npx --yes wrangler@4 kv key put --namespace-id "$NAMESPACE_ID" \
            pair-tokens:current --path data/pair-tokens.json --remote
          echo "pushed number.json ($(wc -c < data/number.json) bytes) and pair-tokens.json"

      - name: report a missing token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping the KV push"

  # The on-chain mirror of the reading. Downstream of the commit, allowed to
  # fail, and holding the only key in the project: a publish that goes wrong
  # must never block, dirty or delay the dataset.
  oracle:
    needs: crawl
    # Cadence: publish at 00/06/12/18 UTC only (measured ~$30-45/month hourly on
    # Robinhood Chain at current gas; 6-hourly is ~$6). Set LEDGE_ORACLE_EVERY_RUN=1
    # as a repo variable to publish hourly.
    if: needs.crawl.outputs.committed == 'true' && vars.LEDGE_ORACLE_ADDRESS != '' && (vars.LEDGE_ORACLE_EVERY_RUN == '1' || contains('00 06 12 18', needs.crawl.outputs.hour))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The data commit happens in the crawl job; this job runs after it, so a
    # failed publish is visible as a red run without ever blocking the data.
    continue-on-error: false
    env:
      LEDGE_ORACLE_KEY: ${{ secrets.LEDGE_ORACLE_KEY }}
      LEDGE_ORACLE_ADDRESS: ${{ vars.LEDGE_ORACLE_ADDRESS }}
      RPC_URL: ${{ vars.RPC_URL }}
    steps:
      # the branch tip, not the triggering SHA: the reading to publish is the
      # one the crawl job just committed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: publish reading
        if: env.LEDGE_ORACLE_KEY != ''
        run: python pipeline/publish_oracle.py

      - name: report a missing key
        if: env.LEDGE_ORACLE_KEY == ''
        run: echo "LEDGE_ORACLE_KEY is not set; skipping the on-chain publish"

