name: backfill

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Number of hours to backfill from the current head"
        required: false
        default: "20"

concurrency:
  group: ledge-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: backfill
        run: python pipeline/crawl.py --backfill-hours ${{ inputs.hours }}
        env:
          RPC_URL: "${{ vars.RPC_URL }}"

      - name: recompute (byte-for-byte gate)
        run: python pipeline/recompute.py --check

      - name: regenerate OG image
        if: hashFiles('site/package.json') != ''
        run: |
          npm ci --prefix site
          npm run og --prefix site

      - name: commit data (and OG image if present)
        run: |
          git config user.name  "ledge-bot"
          git config user.email "ledge-bot@users.noreply.github.com"
          git add data
          if [ -f site/public/og/number.png ]; then
            git add site/public/og/number.png
          fi
          git diff --cached --quiet && { echo "no data change"; exit 0; }
          git commit -m "data: backfill ${{ inputs.hours }}h $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
